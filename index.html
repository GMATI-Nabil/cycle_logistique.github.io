<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exploration de la suite logistique</title>
<style>
  body {
    max-width: 1250px;
    margin: 24px auto;
    padding: 0 16px;
    font-family: system-ui, sans-serif;
    color: #172033;
    background: #f6f8fc;
  }
  h1 { font-size: 1.6rem; }
  .controls, .panel {
    padding: 18px;
    border: 1px solid #d7deea;
    border-radius: 12px;
    background: white;
  }
  .controls {
    display: grid;
    gap: 15px;
    margin-bottom: 18px;
  }
  .control {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }
  label { min-width: 180px; }
  input[type="range"] { flex: 1; min-width: 180px; }
  input[type="number"] { width: 105px; padding: 5px; }
  output { min-width: 65px; font-variant-numeric: tabular-nums; }
  .plots {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
  }
  canvas { display: block; width: 100%; }
  .legend { font-size: 0.9rem; line-height: 1.6; }
  .blue { color: #205ac8; }
  .red { color: #ce392b; }
  .gray { color: #697386; }
  @media (max-width: 800px) {
    .plots { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<h1>Suite logistique : x(n+1) = r x(n) [1 - x(n)]</h1>

<div class="controls">
  <div class="control">
    <label for="r">Paramètre r</label>
    <input id="r" type="range"
           min="0" max="4" step="0.0001" value="2.8">
    <input id="rNumber" aria-label="Valeur précise de r"
           type="number" min="0" max="4" step="0.0001" value="2.8">
  </div>

  <div class="control">
    <label for="x0">Condition initiale x(0)</label>
    <input id="x0" type="range"
           min="0.0001" max="0.9999" step="0.0001" value="0.101">
    <output id="x0Value"></output>
  </div>

  <div class="control">
    <label for="count">Itérations affichées</label>
    <input id="count" type="range"
           min="20" max="1000" step="10" value="100">
    <output id="countValue"></output>
  </div>

  <div class="control">
    <label for="skip">Transitoire à éliminer</label>
    <input id="skip" type="number"
           min="0" max="100000" step="100" value="1000">
    <label style="min-width: auto">
      <input id="hideTransient" type="checkbox">
      Masquer le transitoire
    </label>
  </div>
</div>

<div class="plots">
  <section class="panel">
    <h2>Toile d'araignée</h2>
    <canvas id="web"></canvas>
    <p class="legend">
      <span class="blue">Bleu : y = r x(1 - x)</span><br>
      <span class="gray">Gris : y = x</span><br>
      <span class="red">Rouge : itérations</span>
    </p>
  </section>

  <section class="panel">
    <h2>Évolution des termes</h2>
    <canvas id="series"></canvas>
    <p id="status" class="legend"></p>
  </section>
</div>

<script>
"use strict";

const ids = [
  "r", "rNumber", "x0", "x0Value", "count", "countValue",
  "skip", "hideTransient", "web", "series", "status"
];
const ui = Object.fromEntries(
  ids.map(id => [id, document.getElementById(id)])
);

const f = (r, x) => r * x * (1 - x);

// Ajustement à la taille de l'écran et à sa résolution.
function prepare(canvas) {
  const width = Math.max(250, canvas.getBoundingClientRect().width);
  const height = width;
  const ratio = window.devicePixelRatio || 1;

  canvas.width = Math.round(width * ratio);
  canvas.height = Math.round(height * ratio);
  canvas.style.height = height + "px";

  const ctx = canvas.getContext("2d");
  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);

  return {ctx, width, height};
}

// Repère : abscisses de xmin à xmax, ordonnées de 0 à 1.
function frame(canvas, xmin, xmax, xlabel, ylabel) {
  const {ctx, width, height} = prepare(canvas);
  const margin = {left: 52, right: 18, top: 24, bottom: 48};
  const w = width - margin.left - margin.right;
  const h = height - margin.top - margin.bottom;

  const X = x => margin.left + (x - xmin) * w / (xmax - xmin);
  const Y = y => margin.top + (1 - y) * h;

  ctx.font = "12px system-ui";
  ctx.lineWidth = 1;

  for (let k = 0; k <= 5; k++) {
    const t = k / 5;
    const x = xmin + t * (xmax - xmin);

    ctx.strokeStyle = "#e5eaf2";
    ctx.beginPath();
    ctx.moveTo(X(x), Y(0));
    ctx.lineTo(X(x), Y(1));
    ctx.moveTo(X(xmin), Y(t));
    ctx.lineTo(X(xmax), Y(t));
    ctx.stroke();

    ctx.fillStyle = "#526078";
    ctx.textAlign = "center";
    const label = xmax === 1 ? x.toFixed(1) : String(Math.round(x));
    ctx.fillText(label, X(x), Y(0) + 20);

    ctx.textAlign = "right";
    ctx.fillText(t.toFixed(1), X(xmin) - 8, Y(t) + 4);
  }

  ctx.strokeStyle = "#344054";
  ctx.strokeRect(margin.left, margin.top, w, h);

  ctx.fillStyle = "#172033";
  ctx.textAlign = "right";
  ctx.fillText(xlabel, X(xmax), height - 8);
  ctx.textAlign = "left";
  ctx.fillText(ylabel, 5, 14);

  return {ctx, X, Y};
}

function draw() {
  const r = Number(ui.r.value);
  const x0 = Number(ui.x0.value);
  const count = Number(ui.count.value);
  const requestedSkip = Number(ui.skip.value);
  const skip = ui.hideTransient.checked
    ? Math.min(100000, Math.max(0,
        Number.isFinite(requestedSkip) ? Math.floor(requestedSkip) : 0))
    : 0;

  ui.x0Value.textContent = x0.toFixed(4);
  ui.countValue.textContent = count;

  // Chaque changement de paramètre recommence avec le même x(0).
  let x = x0;
  for (let n = 0; n < skip; n++) x = f(r, x);

  const values = [x];
  for (let n = 0; n < count; n++) {
    x = f(r, x);
    values.push(x);
  }

  // Parabole et diagonale.
  const a = frame(ui.web, 0, 1, "x(n)", "x(n+1)");
  a.ctx.strokeStyle = "#205ac8";
  a.ctx.lineWidth = 2;
  a.ctx.beginPath();
  for (let j = 0; j <= 600; j++) {
    const u = j / 600;
    const v = f(r, u);
    if (j === 0) a.ctx.moveTo(a.X(u), a.Y(v));
    else a.ctx.lineTo(a.X(u), a.Y(v));
  }
  a.ctx.stroke();

  a.ctx.strokeStyle = "#697386";
  a.ctx.lineWidth = 1.2;
  a.ctx.beginPath();
  a.ctx.moveTo(a.X(0), a.Y(0));
  a.ctx.lineTo(a.X(1), a.Y(1));
  a.ctx.stroke();

  // Départ sur l'axe horizontal, puis alternance :
  // verticale vers la parabole, horizontale vers la diagonale.
  a.ctx.strokeStyle = "rgba(206, 57, 43, 0.65)";
  a.ctx.lineWidth = 1;
  a.ctx.beginPath();
  a.ctx.moveTo(a.X(values[0]), a.Y(0));

  for (let n = 0; n < count; n++) {
    a.ctx.lineTo(a.X(values[n]), a.Y(values[n + 1]));
    a.ctx.lineTo(a.X(values[n + 1]), a.Y(values[n + 1]));
  }
  a.ctx.stroke();

  // Série temporelle.
  const b = frame(ui.series, skip, skip + count, "n", "x(n)");
  b.ctx.strokeStyle = "#205ac8";
  b.ctx.lineWidth = 1;
  b.ctx.beginPath();

  values.forEach((value, n) => {
    const px = b.X(skip + n);
    const py = b.Y(value);
    if (n === 0) b.ctx.moveTo(px, py);
    else b.ctx.lineTo(px, py);
  });
  b.ctx.stroke();

  b.ctx.fillStyle = "#ce392b";
  values.forEach((value, n) => {
    b.ctx.beginPath();
    b.ctx.arc(b.X(skip + n), b.Y(value), 2, 0, 2 * Math.PI);
    b.ctx.fill();
  });

  ui.status.textContent =
    `r = ${r.toFixed(4)} ; x(0) = ${x0.toFixed(4)} ; ` +
    `indices affichés : ${skip} à ${skip + count}.`;
}

ui.r.addEventListener("input", () => {
  ui.rNumber.value = ui.r.value;
  draw();
});

ui.rNumber.addEventListener("input", () => {
  if (ui.rNumber.value === "") return;
  const value = Number(ui.rNumber.value);
  if (!Number.isFinite(value) || value < 0 || value > 4) return;
  ui.r.value = value;
  draw();
});

["x0", "count", "skip", "hideTransient"].forEach(id => {
  ui[id].addEventListener("input", draw);
});

window.addEventListener("resize", draw);
draw();
</script>
</body>
</html>
